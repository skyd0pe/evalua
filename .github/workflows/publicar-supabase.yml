# Corre los tests y, si pasan, publica la función `api` en Supabase.
# Necesita el secreto SUPABASE_ACCESS_TOKEN (ver README). Sin él, solo corre los tests y avisa que no publicó.
name: Publicar en Supabase

on:
  push:
    branches: [main]
    paths:
      - core.js
      - supabase/**
      - test/core.test.js
      - .github/workflows/publicar-supabase.yml
  workflow_dispatch:

concurrency:
  group: publicar-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests de las reglas
        run: node --test test/core.test.js
      - name: Publicar la función
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: los tests pasaron, pero no se publicó. Ver README."
            exit 0
          fi
          supabase/desplegar.sh
