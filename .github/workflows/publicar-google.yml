# Publica el servidor en Google Apps Script cada vez que cambian las reglas (core.js) o el adaptador (backend/).
# Corre los tests primero: si alguno falla, no publica nada.
# Actualiza la implementación que ya existe, así la dirección que usa la app no cambia.
# Necesita el secreto CLASPRC_JSON (ver README, "Publicación automática"). Sin él, avisa y no hace nada.
name: Publicar en Google

on:
  push:
    branches: [main]
    paths:
      - core.js
      - backend/**
      - test/core.test.js
      - test/adaptador.test.js
      - .github/workflows/publicar-google.yml
  workflow_dispatch:

concurrency:
  group: publicar-google
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCRIPT_ID: 1nuOi1X-QQx-8yz8g3AEvAT08khfpUmKTYRiAl-JgbarrwzAyfOX3aRjI
  DEPLOYMENT_ID: AKfycbzFclYSxb7tjKDAvBmKqizkFZlU95wxq_OdIVZiQA6hDc1UBvCE9eaKyYiE4BjaT6JSdw
  CLASP: "@google/clasp@2.4.2"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests de reglas y adaptador
        run: node --test test/core.test.js test/adaptador.test.js

      - name: Revisar la credencial
        id: cred
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::warning::Falta el secreto CLASPRC_JSON: los tests pasaron, pero no se publicó en Google. Ver README, 'Publicación automática'."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
            chmod 600 "$HOME/.clasprc.json"
            # clasp 3 guarda la credencial con otro formato ("tokens"); clasp 2.4.2
            # espera "token" + "oauth2ClientSettings". Si vino del 3, se convierte.
            # Solo se muestran nombres de campos, nunca valores.
            python3 - <<'PY'
          import json, os, sys
          p = os.path.expanduser('~/.clasprc.json')
          crudo = open(p, encoding='utf-8', errors='replace').read().lstrip('\ufeff').strip()
          def leer(txt):
              try:
                  return json.loads(txt)
              except Exception:
                  pass
              # Si vino con texto alrededor (por ejemplo, copiado de la terminal), usar lo que está entre llaves.
              a, b = txt.find('{'), txt.rfind('}')
              if a >= 0 and b > a:
                  try:
                      return json.loads(txt[a:b + 1])
                  except Exception:
                      pass
              # Si vino en base64.
              import base64
              for dec in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      return json.loads(dec(txt + '=' * (-len(txt) % 4)).decode('utf-8-sig'))
                  except Exception:
                      pass
              return json.loads(txt)
          def tipo(c):
              return 'nada' if not c else 'letra' if c.isalpha() else 'número' if c.isdigit() else 'espacio' if c.isspace() else 'signo ' + ('comilla' if c in '"\'' else 'otro')
          try:
              d = leer(crudo)
          except Exception as e:
              if crudo.startswith('http') and 'accounts.google.com' in crudo:
                  print('::error::El secreto CLASPRC_JSON tiene la dirección de inicio de sesión de Google, no la credencial. '
                        'Abrí esa dirección, autorizá, y después copiá el contenido del archivo .clasprc.json (empieza con una llave).')
                  sys.exit(1)
              print('::error::Pistas: primer caracter:', tipo(crudo[:1]), '| último:', tipo(crudo[-1:]),
                    '| tiene llave en la posición:', crudo.find('{'), '| renglones:', crudo.count('\n') + 1,
                    '| tiene la palabra token:', 'token' in crudo, '| puntos:', crudo.count('.'),
                    '| parece JWT (eyJ):', crudo.startswith('eyJ'), '| parece token de acceso (ya29):', crudo.startswith('ya29'),
                    '| parece refresh (1//):', crudo.startswith('1//'), '| espacios:', crudo.count(' '))
              # Pistas sin mostrar el contenido: largo, cómo empieza y termina, dónde falla.
              print('::error::El secreto CLASPRC_JSON no es un JSON válido. Largo:', len(crudo),
                    '| empieza con llave:', crudo[:1] == '{', '| termina con llave:', crudo[-1:] == '}',
                    '| falla en:', getattr(e, 'pos', '?'), '| comillas raras:', any(c in crudo for c in '\u201c\u201d'))
              sys.exit(1)
          print('Campos de la credencial:', sorted(d.keys()))
          json.dump(d, open(p, 'w'))
          if 'tokens' in d and 'token' not in d:
              t = d['tokens'].get('default') or next(iter(d['tokens'].values()))
              print('Formato de clasp 3; campos:', sorted(t.keys()))
              d = {
                  'token': {
                      'access_token': t.get('access_token', ''),
                      'refresh_token': t['refresh_token'],
                      'scope': t.get('scope', ''),
                      'token_type': t.get('token_type', 'Bearer'),
                      'expiry_date': 1,
                  },
                  'oauth2ClientSettings': {
                      'clientId': t['client_id'],
                      'clientSecret': t['client_secret'],
                      'redirectUri': 'http://localhost',
                  },
                  'isLocalCreds': False,
              }
              json.dump(d, open(p, 'w'))
              print('Convertida al formato de clasp 2.4.2.')
          PY
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar los archivos del proyecto de Google
        if: steps.cred.outputs.ok == 'true'
        run: |
          mkdir -p gas
          cp core.js gas/Core.js
          cp backend/Code.gs gas/Code.js
          cp backend/appsscript.json gas/appsscript.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > gas/.clasp.json

      - name: Subir el código
        if: steps.cred.outputs.ok == 'true'
        working-directory: gas
        run: npx -y "$CLASP" push --force

      - name: Publicar una versión nueva en la misma dirección
        if: steps.cred.outputs.ok == 'true'
        working-directory: gas
        run: npx -y "$CLASP" deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Comprobar que responde
        if: steps.cred.outputs.ok == 'true'
        run: |
          sleep 5
          URL="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec"
          # Sin -X POST: Google redirige y la segunda pedida tiene que ser GET (como hace el navegador).
          for i in 1 2 3; do
            RESP=$(curl -sSL -H 'Content-Type: text/plain;charset=utf-8' --data '{"a":"cursos"}' "$URL" || true)
            echo "$RESP" | grep -q '"ok":true' && { echo "Responde bien."; exit 0; }
            sleep 10
          done
          echo "$RESP" | head -c 300; echo
          echo "::error::La app publicada no respondió bien."; exit 1

      - name: Borrar la credencial del equipo de GitHub
        if: always()
        run: rm -f "$HOME/.clasprc.json"
